name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-packages:
    name: Node Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/node-setup@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @patii/db run db:generate

      - name: Run Codegen
        run: pnpm --filter @patii/protocol run codegen

      - name: Turbo Build, Lint, Test
        run: pnpm turbo run build lint test

  flutter-packages:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Run Flutter Pub Get
        run: |
          cd packages/dart/patii_protocol && dart pub get
          cd ../../packages/dart/patii_engine && dart pub get
          cd ../../apps/mobile && flutter pub get

      - name: Analyze Dart & Flutter packages
        run: |
          cd packages/dart/patii_protocol && dart analyze .
          cd ../../packages/dart/patii_engine && dart analyze .
          cd ../../apps/mobile && flutter analyze .

      - name: Run Dart & Flutter Tests
        run: |
          cd apps/mobile && flutter test
