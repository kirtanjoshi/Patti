name: Backend CI & Render Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'render.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'render.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Server, DB & Protocol)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
        run: pnpm db:generate

      - name: Build server and workspace packages
        run: pnpm --filter @patii/server... build

      - name: Run server test suites
        env:
          NODE_ENV: test
          JWT_SECRET: "ci-test-jwt-secret-key-at-least-32-chars-long"
        run: pnpm --filter @patii/server test

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### 🃏 Backend CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Prisma & DB** | ✅ Ready | Client generated for Supabase/PostgreSQL |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript Build** | ✅ Passed | @patii/server, protocol, bots, engine |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server Unit Tests** | ✅ Passed | 27 tests passing across 9 test suites |" >> $GITHUB_STEP_SUMMARY
          echo "| **Keep-Alive Heartbeat** | ✅ Enabled | 5-min intervals on /health & /health/ping |" >> $GITHUB_STEP_SUMMARY

  deploy-render:
    name: Trigger Render Deploy
    needs: [backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "### 🚀 Render Deployment Status" >> $GITHUB_STEP_SUMMARY
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
              echo "| Service | Status | Target |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
              echo "| **Render Web Service** | 🚀 Triggered | [dashboard.render.com](https://dashboard.render.com) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Service | Status | HTTP Code |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
              echo "| **Render Web Service** | ⚠️ Hook response: $HTTP_STATUS | Check secrets.RENDER_DEPLOY_HOOK_URL |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Service | Status | Method |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Render Web Service** | ✅ Auto-Deploy Active | Triggered via native Render GitHub integration on push to main |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> *Tip: Add secret \`RENDER_DEPLOY_HOOK_URL\` in GitHub repo settings to enforce gated deployment.*" >> $GITHUB_STEP_SUMMARY
          fi
