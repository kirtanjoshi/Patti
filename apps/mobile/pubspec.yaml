name: patii
description: "Patii — Multiplayer Nepali card games in one place."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  socket_io_client: ^3.0.2
  easy_localization: ^3.0.7
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  audioplayers: ^6.1.1
  confetti: ^0.8.0
  flutter_svg: ^2.0.17
  http: ^1.2.2
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4
  app_links: ^6.3.3
  google_sign_in: ^6.2.2

  # Local workspace Dart packages
  patii_engine:
    path: ../../packages/dart/patii_engine
  patii_protocol:
    path: ../../packages/dart/patii_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/audio/
    - assets/fonts/
    - assets/images/cards/
