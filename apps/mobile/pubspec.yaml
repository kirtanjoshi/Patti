name: patii
description: "Patii — Multiplayer Nepali card games in one place."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  socket_io_client: ^3.0.2
  easy_localization: ^3.0.7

  # Local workspace Dart packages
  patii_engine:
    path: ../../packages/dart/patii_engine
  patii_protocol:
    path: ../../packages/dart/patii_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
