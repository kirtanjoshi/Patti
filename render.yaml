services:
  - type: web
    name: patii-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pnpm install && pnpm db:generate && pnpm --filter @patii/server... build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /health/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
